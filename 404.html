<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — MUZZ AI</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#060A12">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/muzz-x-avatar.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Sans:wght@300;400&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--night:#060A12;--text:#E8EEF7;--dim:#93A1B8;--signal:#3DA9FF;--threat:#FF4A3D;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(90% 70% at 80% 30%, #0E1B33 0%, var(--night) 60%);
    color:var(--text);
    font-family:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;font-weight:300;line-height:1.6;
    display:flex;align-items:flex-end;box-sizing:border-box;
    padding:max(24px,env(safe-area-inset-left,0px));padding-bottom:clamp(3rem,10vh,6rem);
    -webkit-font-smoothing:antialiased;
  }
  main{max-width:36rem;}
  .code{font-family:'IBM Plex Mono',ui-monospace,monospace;color:var(--threat);font-size:0.85rem;margin:0 0 1rem;}
  h1{font-family:'Archivo','Arial Black',Arial,sans-serif;font-weight:800;font-stretch:112%;font-size:clamp(2rem,6vw,3.2rem);line-height:1.05;margin:0 0 1rem;}
  p{color:var(--dim);margin:0 0 2rem;}
  a{display:inline-block;font-family:'Archivo',Arial,sans-serif;font-weight:700;font-size:0.85rem;letter-spacing:0.1em;text-transform:uppercase;text-decoration:none;background:var(--signal);color:#04101F;padding:0.9rem 1.3rem;border-radius:2px;}
  a:focus-visible{outline:2px solid var(--signal);outline-offset:3px;}
</style>
</head>
<body>
  <main>
    <p class="code">404 · request refused at the boundary</p>
    <h1>This page isn’t here.</h1>
    <p>The address may have changed, or the page hasn’t been published yet.</p>
    <a href="/">Back to MUZZ AI</a>
  </main>
</body>
</html>
