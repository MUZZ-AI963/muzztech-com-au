<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 96" role="img" aria-labelledby="title desc">
  <title id="title">Australian Home Grown AI</title>
  <desc id="desc">Lockup for Australian home-grown AI — National AI Centre directory affiliation. Not a Commonwealth Coat of Arms.</desc>
  <!-- Quiet gov-adjacent lockup: Southern Cross + wordmark. Not the restricted Coat of Arms. -->
  <rect width="280" height="96" rx="4" fill="#0B1220" stroke="#2B4468" stroke-width="1.2"/>
  <g transform="translate(22,18)" fill="#E8EEF7">
    <!-- Southern Cross -->
    <polygon points="18,2 19.2,6.2 23.5,6.2 20,8.8 21.2,13 18,10.4 14.8,13 16,8.8 12.5,6.2 16.8,6.2" />
    <polygon points="32,14 32.7,16.5 35.2,16.5 33.2,18 33.9,20.5 32,19 30.1,20.5 30.8,18 28.8,16.5 31.3,16.5" transform="scale(0.95)" />
    <polygon points="10,22 10.7,24.5 13.2,24.5 11.2,26 11.9,28.5 10,27 8.1,28.5 8.8,26 6.8,24.5 9.3,24.5" />
    <polygon points="26,28 26.6,30 28.6,30 27,31.2 27.6,33.2 26,32 24.4,33.2 25,31.2 23.4,30 25.4,30" />
    <circle cx="22" cy="20" r="1.35" />
  </g>
  <text x="64" y="36" fill="#93A1B8" font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif" font-size="9" letter-spacing="0.18em">AUSTRALIAN</text>
  <text x="64" y="58" fill="#E8EEF7" font-family="Archivo, Arial Black, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="0.02em">Home Grown AI</text>
  <text x="64" y="76" fill="#3DA9FF" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" letter-spacing="0.06em">National AI Centre · directory</text>
</svg>
